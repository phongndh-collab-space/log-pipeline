name: log-tracing-postgres
services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sql000
      POSTGRES_DB: log_tracing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d log_tracing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
